# Local development infrastructure for the TVET e-Gateway backend.
# Mirrors the Central Cloud / Institution Edge Node tech stack from docs/architecture.md §13
# (PostgreSQL, MinIO, Redis). Not intended for production deployment as-is.
#
# Usage: docker compose up -d
# Then follow README.md to run the backend against these services.

services:
  postgres:
    image: postgres:16-alpine
    container_name: tvet-lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tvet
      POSTGRES_PASSWORD: tvet_dev_password
      POSTGRES_DB: tvet_lms
    ports:
      - "5432:5432"
    volumes:
      - tvet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvet -d tvet_lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tvet-lms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tvet_minio_admin
      MINIO_ROOT_PASSWORD: tvet_minio_dev_password
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - tvet_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tvet-lms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tvet_redis_data:/data

volumes:
  tvet_postgres_data:
  tvet_minio_data:
  tvet_redis_data:
